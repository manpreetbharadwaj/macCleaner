<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8BFF"/>
      <stop offset="0.55" stop-color="#6E5BFF"/>
      <stop offset="1" stop-color="#A24DF5"/>
    </linearGradient>
    <radialGradient id="glowMint" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#3EF0C8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3EF0C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen" cx="0.25" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22306E"/>
      <stop offset="1" stop-color="#3A2A86"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9E0"/>
      <stop offset="1" stop-color="#3CC8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1B1150" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#160C45" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glowMint)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
  </g>

  <g filter="url(#soft)">
    <!-- lid -->
    <rect x="270" y="318" width="484" height="318" rx="36" fill="#FFFFFF"/>
    <rect x="300" y="348" width="424" height="258" rx="16" fill="url(#screen)"/>
    <!-- base -->
    <path d="M214 652 H810 a14 14 0 0 1 14 14 v6 a34 34 0 0 1 -34 34 H234 a34 34 0 0 1 -34 -34 v-6 a14 14 0 0 1 14 -14 Z" fill="#FFFFFF"/>
    <rect x="452" y="652" width="120" height="16" rx="8" fill="#D9DCF5"/>
  </g>

  <!-- main sparkle on the screen -->
  <path d="M512 388 Q524 465 600 477 Q524 489 512 566 Q500 489 424 477 Q500 465 512 388 Z" fill="url(#spark)"/>
  <!-- small sparkles -->
  <path d="M640 404 Q644 428 668 432 Q644 436 640 460 Q636 436 612 432 Q636 428 640 404 Z" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="M772 214 Q779 254 819 261 Q779 268 772 308 Q765 268 725 261 Q765 254 772 214 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="842" cy="352" r="12" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>

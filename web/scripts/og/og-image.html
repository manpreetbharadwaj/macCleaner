<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif;
    background:
      radial-gradient(60% 90% at 0% 0%, rgba(110, 91, 255, 0.55), transparent 60%),
      radial-gradient(50% 80% at 100% 100%, rgba(19, 181, 224, 0.4), transparent 60%),
      linear-gradient(150deg, #12153a 0%, #1c1450 60%, #0f1a3d 100%);
    color: #fff;
    position: relative;
  }
  .copy { position: absolute; left: 72px; top: 92px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .brand img { width: 64px; height: 64px; border-radius: 15px; }
  h1 { margin: 44px 0 0; font-size: 58px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 800; }
  h1 span { background: linear-gradient(100deg, #7da4ff, #9d8bff 50%, #d18cff); -webkit-background-clip: text; color: transparent; }
  p { margin: 26px 0 0; font-size: 25px; line-height: 1.4; color: rgba(230, 232, 255, 0.82); }
  .shot { position: absolute; left: 640px; top: 96px; width: 760px; border-radius: 16px; overflow: hidden; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.12); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../public/app-icon-256.png" alt="" /> MacBook Cleaner</div>
    <h1>Clean. Monitor.<br /><span>Understand your Mac.</span></h1>
    <p>Free up storage, check CPU, memory, running apps and battery health — all on your Mac.</p>
  </div>
  <div class="shot"><img src="../../public/screens/performance-dark.jpg" alt="" /></div>
</body>
</html>

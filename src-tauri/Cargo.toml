[package]
name = "macbook-cleaner"
version = "1.0.0"
description = "MacBook Cleaner — safe, local-first storage cleanup for macOS"
authors = ["MacBook Cleaner"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `dodo_test_mode`: build against Dodo Payments' sandbox (test.dodopayments.com
# + test.checkout.dodopayments.com) with the real sandbox product id baked in
# — see src/license/config.rs. NOT in `default`, so a normal `cargo build`
# (and every release build) only ever talks to live Dodo endpoints; sandbox
# config can't ship by accident. Build the sandbox variant explicitly with
# `cargo build --features dodo_test_mode` / `cargo test --features dodo_test_mode`.
[features]
default = []
dodo_test_mode = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
sysinfo = "0.33"
walkdir = "2"
dirs = "5"
plist = "1"
sha2 = "0.10"
whoami = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
trash = "5"
tauri-plugin-notification = "2.4.0"
url = "2"
# Mach host statistics (CPU ticks, VM stats), sysctl and libproc for the
# Performance tab — see src/perf/. Already in the dependency tree.
libc = "0.2"
# Talks to Dodo Payments' public license activate/validate/deactivate
# endpoints only — see src/license/dodo.rs. No secret API key is ever used;
# rustls avoids depending on the system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Signs the trial anchor stored in Keychain so a casual edit (Keychain
# Access.app, the `security` CLI) is detectable — see src/license/trial.rs.
hmac = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
# Used only to pump the current thread's run loop briefly while waiting for
# a UNUserNotificationCenter completion handler — see native_notifications.rs.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFRunLoop", "CFDate", "CFBase", "std"] }
# Used to read the same volume-capacity values macOS's own Storage settings
# does (NSURLVolumeAvailableCapacityForImportantUsageKey), rather than raw
# statfs, which reports free space differently (see src/disk.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSURL",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSValue",
    "NSObject",
    "NSDate",
    "NSLocale",
] }
# Performance tab: NSWorkspace.runningApplications is the authoritative list
# of user-facing apps (the ones in the Dock), with their launch dates — see
# src/perf/processes.rs. Already in the dependency tree via tao.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationResponse", "UNNotification", "UNNotificationSettings", "UNError", "std", "block2"] }
# Keychain storage for the trial anchor and license credentials — see
# src/license/keychain.rs. Chosen specifically because Keychain items
# generally outlive the app being deleted and reinstalled, which is most of
# what makes trial-anchor tracking resistant to the obvious "delete app,
# redownload" reset without any device fingerprinting.
security-framework = "3"
